<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Моя неделя — интерактивное расписание</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182338;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1040px;margin:auto}.hero{background:linear-gradient(120deg,#283d79,#546dc7);color:white;border-radius:24px;padding:28px;box-shadow:0 10px 30px #253c7030}h1{margin:0 0 8px;font-size:30px}.muted{opacity:.8}.progress{height:11px;border-radius:10px;background:#ffffff55;overflow:hidden;margin-top:15px}.bar{height:100%;width:0;background:#9bf2c4;transition:width .2s}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.toolbar button,.days button,.item button{border:0;cursor:pointer;border-radius:12px;padding:11px 14px;background:white;color:#293f6c;font-weight:650}.toolbar button.active,.days button.active{background:#344fa5;color:white}.days{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}.card{background:white;border-radius:18px;padding:16px 18px;margin:10px 0;display:flex;align-items:center;gap:15px;box-shadow:0 2px 12px #1823380b}.card.current{background:#e9f7ef;outline:2px solid #2b9760;box-shadow:0 4px 16px #2b976025}.card.current .time{color:#187044}.card.current .time::after{content:"Сейчас";display:block;font-size:11px;margin-top:4px}.time{min-width:115px;font-weight:700;color:#5d6b86;font-size:14px}.label{flex:1;min-width:0}.label strong{display:block}.label small{color:#71809b}.check{width:23px;height:23px;accent-color:#3c63c9;cursor:pointer}.done .label{text-decoration:line-through;opacity:.55}.section{margin-top:28px}.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.weekgrid section{background:#eaf0fc;border-radius:18px;padding:12px}.weekgrid h3{margin:8px}.weekgrid .card{padding:10px;gap:9px}.weekgrid .time{min-width:75px;font-size:11px}.weekgrid .label strong{font-size:13px}.weekgrid .label small{font-size:11px}.weekgrid .check{width:18px;height:18px}.note{color:#64738b;font-size:13px;margin-top:20px}.edit{border:0;background:none;color:#5573c5;cursor:pointer}button:hover{filter:brightness(.96)}@media(max-width:520px){body{padding:12px}.hero{padding:22px}.card{padding:13px;gap:10px}.time{min-width:93px;font-size:12px}h1{font-size:25px}}</style></head><body><main><header class="hero"><h1>📅 Моя неделя</h1><div class="muted">Личный распорядок · 08:00–23:30 · начиная с 26 октября 2026</div></header><div class="days" id="days"></div><div id="content"></div><p class="note">✎ Меняй название занятия. Изменения сохраняются в этом браузере на этом устройстве.</p></main><script>
const dayNames=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const base=[['08:00–09:00','🌅 Подъём и завтрак','Утро'],['09:00–10:00','☕ Свободное время','Личные задачи'],['10:00–10:30','🧘 Осанка и стопы','Корректирующие упражнения'],['10:30–11:30','💻 Работа / личные задачи','Свободный блок'],['11:30–13:00','🇪🇸 Испанский','90 минут'],['13:00–13:15','🧠 Медитация','15 минут'],['13:15–14:15','🍽️ Обед и отдых','Перерыв'],['14:15–18:00','💻 Работа / учёба / личные дела','Гибкий блок'],['18:00–19:00','💪 Силовая тренировка','Тренировка'],['19:00–19:30','🍽️ Ужин и отдых','Восстановление'],['19:30–21:00','🚶 Прогулка','Активность'],['21:00–22:00','✨ Личное время','Отдых'],['22:00–23:00','📚 Чтение','1 час'],['23:00–23:30','🌙 Подготовка ко сну','Сон в 23:30']];
let selected=(new Date().getDay()+6)%7,mode='day';const key='weeklySchedule2026v3';let store;try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch{store={}};const save=()=>localStorage.setItem(key,JSON.stringify(store));
function entries(d){return base.map((b,i)=>{let title=b[1],desc=b[2];if(i===4){title=d%2===0?'🎧 Испанский — аудирование':'🗣️ Испанский — разговорная практика';desc='90 минут ежедневно'}if(i===8){const training=[['💪 Спина + бицепс','Силовая тренировка'],['💪 Грудь + трицепс','Силовая тренировка'],['🚴 Лёгкое кардио / отдых','Восстановление без силовой'],['💪 Ноги + бицепс','Силовая тренировка'],['💪 Плечи + трицепс','Силовая тренировка'],['🌿 Отдых','День восстановления'],['🌿 Отдых','День восстановления']];[title,desc]=training[d]}const id=d+'-'+i;return {id,time:b[0],title:store[id+'-title']||title,desc}})}
function card(e){const el=document.createElement('article');el.className='card';el.dataset.day=e.id.split('-')[0];el.dataset.time=e.time;const time=document.createElement('span');time.className='time';time.textContent=e.time;const label=document.createElement('div');label.className='label';const title=document.createElement('strong');title.textContent=e.title;const sub=document.createElement('small');sub.textContent=e.desc;label.append(title,sub);const edit=document.createElement('button');edit.className='edit';edit.textContent='✎';edit.title='Изменить занятие';edit.onclick=()=>{const v=prompt('Название занятия:',e.title);if(v&&v.trim()){store[e.id+'-title']=v.trim();save();render()}};el.append(time,label,edit);return el}
function highlightCurrent(){const now=new Date();const day=(now.getDay()+6)%7;const minutes=now.getHours()*60+now.getMinutes();document.querySelectorAll('.card').forEach(el=>{const [start,end]=el.dataset.time.split('–').map(t=>{const [h,m]=t.split(':').map(Number);return h*60+m});const current=Number(el.dataset.day)===day&&minutes>=start&&minutes<end;el.classList.toggle('current',current);if(current)el.setAttribute('aria-current','time');else el.removeAttribute('aria-current')})}
function render(){const days=document.getElementById('days');days.innerHTML='';if(mode==='day')dayNames.forEach((name,d)=>{let b=document.createElement('button');b.textContent=name;b.className=selected===d?'active':'';b.onclick=()=>{selected=d;render()};days.append(b)});const c=document.getElementById('content');c.innerHTML='';if(mode==='day'){const h=document.createElement('h2');h.textContent=dayNames[selected];c.append(h);entries(selected).forEach(e=>c.append(card(e)))}else{const grid=document.createElement('div');grid.className='weekgrid';dayNames.forEach((name,d)=>{const s=document.createElement('section');const h=document.createElement('h3');h.textContent=name;s.append(h);entries(d).forEach(e=>s.append(card(e)));grid.append(s)});c.append(grid)}highlightCurrent()}
render();setInterval(highlightCurrent,15000);window.addEventListener('focus',highlightCurrent);document.addEventListener('visibilitychange',()=>{if(!document.hidden)highlightCurrent()});</script></body></html>
